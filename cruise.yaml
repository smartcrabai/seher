sdk: seher
model: build
plan_model: plan
languages:
  pr: English
  plan: English
cleanup_after_pr: true
groups:
  review:
    if:
      file-changed: verify-wiring
    max_retries: 2
    steps:
      review-uncommitted:
        prompt: |-
          This is a read-only review of all uncommitted changes.
          Execute the procedure below directly; do not depend on an external skill or command.
          Do not edit, stage, or commit files, and do not suggest commands that mutate the git state.
          Return only the review report. Fixes are handled by the following step.

          ## Phase 1: Gather the diff

          Inspect the complete working-tree change before reviewing anything. Do not review only one kind of diff.

          1. Run `git diff` for unstaged changes to tracked files.
          2. Run `git diff --cached` for staged changes.
          3. Run `git status --porcelain` to identify untracked files (`??` entries).
          4. Read untracked files that look like source code (not binaries, lockfiles, generated output, or vendored content) and include them in the review. Skip large files, binaries, and clearly generated output.

          If all three checks are empty, state that there is nothing to review and stop.
          Do not invent findings for an empty diff.

          ## Phase 2: Discover project-specific perspectives

          1. List `./.review/*.md`. If the directory does not exist or matches no files, apply generic perspectives only and state that plainly in the final report.
          2. For each perspective file, first read only its YAML frontmatter and its "When to apply" section to judge relevance to this diff.
          3. Drop perspectives that are clearly irrelevant (for example, a database-migration-safety perspective when the diff contains no database changes). Pass only relevant perspectives to the next phase.
          4. For each relevant perspective, have its reviewer read the complete file, including frontmatter. If there are more than six relevant files, group them into batches of at most three per reviewer.

          ## Phase 3: Run parallel reviews

          Use the same complete diff for eight separate generic reviewers and run them concurrently whenever possible.
          If same-named review criteria (code-review, ai-antipattern, security-review, etc.) are available, they may add criteria, but an external skill invocation is not required; the criteria below are the minimum.

          1. **Code review (correctness, reuse, simplification, efficiency)**
             Check logic errors, wrong conditions, boundary values, state handling, and races.
             Also check duplicated existing helpers, needless complexity, and inefficient processing.
          2. **AI antipattern**
             Check for implementations that answer a different question, patterns found nowhere else in the codebase, and overly generic solutions to a narrow problem.
             Check for hallucinated or deprecated APIs, syntactically valid but semantically wrong code, unwired parameters or fields, copy-paste inconsistencies, premature abstractions, unrequested compatibility shims, dead code, and unjustified fallbacks.
          3. **Security**
             Check SQL, command, and template injection; broken authentication or authorization; hardcoded secrets; unsafe deserialization; path traversal; SSRF; insecure cryptography or randomness; sensitive data in logs; and insecure defaults.
          4. **Edge cases and failure paths**
             Check failures from I/O and external calls, empty/zero/maximum values, Unicode, concurrency, abnormal inputs, resource cleanup, and inconsistent state after partial failure.
          5. **Backward compatibility**
             Check whether existing callers, public signatures, endpoints, fields, serialization formats, or configuration formats are broken.
             Skip this perspective only when the user or project explicitly permits breaking changes, and record the reason in the final report. When uncertain, run it.
          6. **Functional impact**
             Check for lost or degraded existing functionality, unintended new constraints, and hardcoded assumptions that unnecessarily close foreseeable extension points.
          7. **Test sufficiency**
             Check whether tests were added or updated for changed behavior, whether stale assertions remain, and whether removed behavior left orphaned tests.
             Read relevant existing tests; the diff alone is insufficient to judge what was already covered.
          8. **Unit-test coverage**
             Check normal, error/abnormal, and boundary cases, and verify that assertions check real outcomes rather than merely "does not throw".
             Read relevant existing tests to identify untested paths remaining after this diff.

          Assign reviewers to each relevant project-specific perspective as well.
          Every reviewer must report only confident findings with a concrete reproduction condition (input, sequence, or state).
          Do not report style preferences, unsupported possibilities, or speculation without a concrete failure scenario.
          If there are no findings, the reviewer must return the literal text `NO FINDINGS`.

          Give each reviewer a self-contained input containing:
          - The complete `git diff` and `git diff --cached` output
          - Paths and contents of untracked source files reported by `git status --porcelain`
          - Complete contents of the project-specific perspective files assigned to that reviewer
          - For test-sufficiency and unit-test-coverage reviewers, paths of relevant existing test files and an explicit instruction to read them
          Do not make any reviewer depend on another reviewer's output. Every reviewer uses the same complete diff.

          Every finding must use exactly this format:

          FINDING
          file: <path>
          line: <number or range>
          severity: critical | major | minor
          perspective: <generic dimension name or custom perspective name>
          summary: <one sentence>
          detail: <why it is a problem and a concrete failure scenario>

          ## Phase 4: Deduplicate and consolidate findings

          Treat findings as duplicates when they identify the same root cause at the same location (same file and overlapping line ranges).
          When merging duplicates, keep the highest severity and the clearest, most concrete explanation.
          List every perspective that identified the finding.
          Before finalizing, re-check questionable findings against the actual files and discard anything unsupported or contradicted by the code.
          Do not inflate the report with low-confidence findings.

          ## Phase 5: Report in English

          Use this structure. Omit severity sections with no findings.

          # Review Report: Uncommitted Changes
          ## Summary
          State the diff scope, overall assessment, and counts by severity in one to three sentences.
          ## Findings
          ### Critical
          - `<file>:<line>` — <summary> (perspectives: <list>)
            <detail>
          ### Major
          - `<file>:<line>` — <summary> (perspectives: <list>)
            <detail>
          ### Minor
          - `<file>:<line>` — <summary> (perspectives: <list>)
            <detail>
          ## Perspectives applied
          - Generic: code review, AI antipattern, security, edge cases and failure paths, backward compatibility (or why it was skipped), functional impact, test sufficiency, unit-test coverage
          - Project-specific (`./.review/`): files used, files excluded as irrelevant, or no matching files

          If there are no findings at all, state that clearly and still list every perspective applied.
          End by stating plainly that this review only reports issues and does not modify files; fixes are a separate deliberate step.
      fix-review-result:
        prompt: |
          Based on the review results below, address anything that seems to need attention.
          If you judge something to be a false positive, leave a reason and skip it.
          If there is nothing to report, do nothing.
          ---
          {prev.output}
steps:
  mise-trust:
    command: |-
      mise trust || true
  write-test-first:
    prompt: |
      Based on {plan}, create **test code only**.
      The production code implementation will be done in the next step.
      Do not write any non-test logic in this step.

      **Why write only tests:**
      The purpose of test-first is to specify "what to build" in code before starting implementation.
      If you write the implementation too, the tests become a rubber-stamp of the implementation rather than a specification, and you lose the chance to notice design flaws.
      Tests are expected to fail at this point; write them on the assumption they will pass once implementation is complete.

      **Steps:**
      1. Review the plan report and understand the planned behavior and interfaces.
      2. Examine the existing code and tests in the target module to understand the test patterns.
      3. Write unit tests for the planned feature.
      4. Decide whether integration tests are needed, and write them if so:
         - Is there a data flow spanning three or more modules?
         - Does a new status/state join an existing workflow?
         - Does a new option propagate all the way through the call chain?
         - Is the new feature triggered from an existing entry point (CLI command, API endpoint, UI event, etc.)?
         - If any of these apply, write an integration test.
         - When the feature is triggered from an entry point, include at least one test that exercises the behavior through that entry point instead of calling the new function directly.
      5. Run the type checker/build and confirm the test code has no syntax errors.

      **On creating stubs to make the build pass:**
      Only when a function or type referenced by a test is undefined and the build fails,
      place a **minimal stub only** on the implementation side.
      The stub body must always be an "unimplemented" marker:
      - Rust: `todo!()` / `unimplemented!()`
      - TypeScript / JavaScript: `throw new Error("not implemented")`
      - Go: `panic("not implemented")`
      - Python: `raise NotImplementedError`

      Never write even a single line of real logic inside a stub.
      "It's easy, so I'll just implement it while I'm at it" is forbidden. If you feel the urge, that's work for the next step.

      **Test-writing policy:**
      - Follow the project's existing test patterns (naming conventions, directory layout, helpers).
      - Write tests using a Given-When-Then structure.
      - One test, one concept. Don't mix multiple concerns into a single test.
      - Cover the happy path, error cases, boundary values, and edge cases.

      **If the plan explicitly states that no tests will be added:**
      Follow the plan and do not write new test code.
      Even then, never end your turn with a question to the user.
      This step runs unattended, so nobody can answer it; the step would finish with no file changes and be retried until the workflow aborts.
      Instead, declare the intentional no-change with a reason before finishing, in one of two ways:
      - Call the `skip_step` tool with the reason in `reason`, if that tool is available.
      - Otherwise, include a line starting at the beginning of a line in your output: `NO_CHANGES_INTENTIONAL: <reason>`.
      Either one lets the workflow move on to the next step despite the lack of file changes.
    if:
      no-file-changes:
        retry: true
  implement-after-tests:
    prompt: |
      Following the plan in {plan}, implement the code so that the tests pass.

      **Important**: The tests have already been written. Implement the code so the existing tests pass.
      - Review the existing test files to understand the expected behavior.
      - Implement the production code so the tests pass.
      - Defining functions and types is not the end of the implementation. Wire them into the existing execution paths (entry points, routing, command definitions, event handlers, etc.) so the feature is actually invoked.
      - Since tests are already written, you generally don't need to add more, but you may add tests if necessary.
      - You may modify tests if a fix requires it.
      - Running the build is mandatory. After implementing, run the build (type check) and confirm there are no type errors.
      - Running the tests is mandatory. After the build succeeds, always run the tests and confirm all of them pass.
      - If you introduce a new contract string such as a file name or config key, define it as a constant in a single place.

      **Required self-check before completing implementation:**
      Before running the build and tests, confirm the following:
      - If you added a new parameter/field, verified via grep that it is actually passed in from the callers.
      - Verified via grep that every newly defined function/class/type/constant is referenced from production code other than tests (i.e. reachable from an entry point). Code referenced only by tests is unwired and therefore incomplete.
      - Where you use `??`, `||`, or `= defaultValue`, verified the fallback is actually necessary.
      - Confirmed that code/exports replaced during refactoring haven't been left behind.
      - Confirmed you haven't added functionality that wasn't requested in the task instructions.
      - Confirmed no if/else branches call the same function differing only by arguments.
      - Confirmed the new code matches existing implementation patterns (API call style, type definition style, etc.).

      **Required output (include the headings)**
      ## Summary
      - Overview of the work performed
      ## Changes
      - Overview of the changes
      ## Build Result
      - Build execution result
      ## Test Result
      - Test command and result
    if:
      no-file-changes:
        retry: true
  verify-wiring:
    prompt: |-
      Verify that the implemented feature is actually wired into the production execution paths.

      **Background**: Even if functions and types are defined and the tests pass, a feature that is unreachable from any entry point is the same as a feature that does not exist. This step exists to prevent work from being marked complete while it is "implemented but never called from the main flow".

      **Steps:**
      1. From the changes made in this task (uncommitted changes plus commits since the base branch), list the functions, classes, types, constants, and exports that were added or modified.
      2. For each of them, verify via grep that it is referenced from production code other than test code.
      3. Treat anything referenced only by tests as "unwired": consult {plan} and wire it into a call path from an entry point (main, router, CLI command definition, UI event, DI registration, plugin registration, etc.).
      4. If new config keys, CLI flags, or environment variables were introduced, confirm that both the reading side and the passing side exist and that values actually propagate end to end.
      5. If you added or fixed any wiring, rerun the build and the tests and confirm everything passes.

      **Judgment criteria:**
      - If wiring is intentionally unnecessary (e.g. library code whose purpose is to be exported as a public API), you may skip it, but state the reason explicitly in the output.

      **Required output (include the headings)**

      ## Wiring Verification Result

      - For each new symbol, where it is referenced from production code (file:line)
      - If unwired code was fixed, what was done and the rerun build/test results
      - Anything judged as not needing wiring, with the reason
  only-english:
    prompt: |-
      /only-english
  simplify-pass:
    prompt: |-
      Review the changes made in this task (uncommitted changes plus commits since the base branch)
      as a lazy senior developer would, and cut the over-engineering.
      Lazy means efficient, not careless. The best code is the code never written.

      **Prerequisite: never be lazy about understanding**
      Before deciding anything, read every file the change touches and trace the real execution flow end to end.
      Shrinking a diff without comprehension is the dangerous kind of laziness: it ships a confident wrong fix.

      **The ladder (evaluate top-down, stop at the first rung that holds):**
      1. Does this need to exist at all? Speculative need = delete it and say so in one line (YAGNI).
      2. Is it already in this codebase? Reuse the helper, util, type, or pattern that already lives here. Re-implementing what sits a few files over is the most common waste.
      3. Does the stdlib cover it? Then use it.
      4. Does a native platform feature cover it? `<input type="date">` over a picker lib, CSS over JS, a DB constraint over app code.
      5. Does an already-installed dependency solve it? Never add a new dependency for what a few lines can do.
      6. Can it be one line? Then one line.
      7. Only then: the minimum code that works.

      **What to cut:**
      - Unrequested abstractions: an interface with one implementation, a factory for one product, config for a value that never changes.
      - Boilerplate and scaffolding "for later" — later can scaffold for itself.
      - if/else branches calling the same function differing only by arguments.
      - Fallbacks that aren't actually needed (`??`, `||`, `= defaultValue`).
      - Old code/exports left behind by a refactor that replaced them.
      - Functionality not requested in the task instructions.
      Deletion over addition, boring over clever — clever is what someone decodes at 3am.
      Two options of the same size? Take the one that's correct on edge cases. Lazy means writing less code, not picking the flimsier algorithm.

      **Bug fixes address the root cause, not the symptom:**
      Grep every caller of the function you are about to touch before editing. One guard in the shared
      function is a smaller diff than a guard in every caller, and it also fixes the sibling callers
      the report never mentioned.

      **Record deliberate simplifications:**
      If you keep a simplification with a known ceiling (global lock, O(n^2) scan, naive heuristic),
      leave a one-line `ponytail:` comment naming the ceiling and the upgrade path
      (e.g. `// ponytail: global lock, per-account locks if throughput matters`).

      **Never simplify away:**
      Input validation at trust boundaries, error handling that prevents data loss, security measures,
      accessibility basics, and anything explicitly requested by {plan} or the task instructions.

      **Mandatory verification:**
      After changing anything, run the build (type check) and the tests and confirm everything passes.
      If something breaks, revert that simplification or fix it so it passes.

      **If there is nothing to cut:**
      Never end your turn with a question to the user.
      This step runs unattended, so nobody can answer it and the workflow would stall.
      Declare the intentional no-change with a reason before finishing, in one of two ways:
      - Call the `skip_step` tool with the reason in `reason`, if that tool is available.
      - Otherwise, include a line starting at the beginning of a line in your output: `NO_CHANGES_INTENTIONAL: <reason>`.

      **Required output (include the headings)**

      ## Simplification Result

      - What was cut, and which rung of the ladder drove the decision
      - Over-engineering candidates left in place, with the reason
      - Build and test results
  review-pass:
    group: review
after-pr:
  pr-ready:
    command: |-
      gh pr ready {pr.number}
  sync-base:
    command: |
      base=$(gh pr view {pr.number} --json baseRefName -q '.baseRefName')
      git fetch origin "$base"
      git merge "origin/$base" --no-edit
  resolve-conflict:
    skip: prev.success
    prompt: |
      A conflict with the base branch occurred during `git merge`.
      Check the unresolved files with `git status`, resolve all conflict
      markers (<<<<<<<), then run `git add <files>` / `git commit`.
      There is no need to push — the next step handles that.
  push-after-sync:
    command: |-
      git push
  wait-ci:
    command: |-
      gh pr checks {pr.number} --watch
  fix-ci-error:
    skip: prev.success
    prompt: |
      The GitHub Actions CI for PR #{pr.number} is failing.
      Identify the failing check with `gh pr checks {pr.number}`,
      check the detailed logs with `gh run view <run-id> --log-failed` or similar, and fix the cause.
      After fixing it, update the PR branch with git add / commit / push.
    if:
      file-changed: sync-base
    next: wait-ci
  merge:
    command:
    - |-
      test "$(gh pr view {pr.number} --json statusCheckRollup -q '.statusCheckRollup | length')" -eq 0 || gh pr checks {pr.number} --watch
    - |-
      gh pr merge {pr.number} --squash
