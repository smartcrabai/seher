name: Cruise

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  gate:
    if: github.event_name == 'issues' || !github.event.issue.pull_request
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should-run: ${{ steps.trigger.outputs.should-run }}
    steps:
      - id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event_name == 'issue_comment' && github.event.comment.user.login || github.event.issue.user.login }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || github.event.issue.body }}
        run: |
          permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null || true)"
          if [[ "$permission" != "write" && "$permission" != "admin" ]]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re

          text = f"{os.environ.get('TITLE', '')}\n{os.environ.get('BODY', '')}"
          matched = re.search(r"(^|\s)@cruise([\s.,!?;:]|$)", text, re.IGNORECASE)
          print(f"should-run={'true' if matched else 'false'}")
          PY

  cruise:
    needs: gate
    if: needs.gate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: cruise-${{ github.event.issue.number || github.run_id }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - uses: smartcrabai/cruise@e599274ccea20180da858e87ef2dd497ed009d49 # v1
        with:
          model: kimi-for-coding/kimi-for-coding
          plan_model: kimi-for-coding/kimi-for-coding
          env: |
            KIMI_API_KEY=${{ secrets.KIMI_API_KEY }}
